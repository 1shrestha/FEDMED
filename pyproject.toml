[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed"
version = "0.1.0"
description = "FedMed privacy-preserving cross-silo federated learning engine"
requires-python = ">=3.13"
dependencies = [
    "flwr==1.34.0",
    "ray==2.58.0",
    "numpy",
    "torch",
    "pyyaml",
]

[tool.flwr.app]
publisher = "fedmed"

[tool.flwr.app.components]
serverapp = "app.main:server_app"
clientapp = "app.main:client_app"

[tool.flwr.app.config]
num-server-rounds = 1
