[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedmed"
version = "0.1.0"
description = "FedMed privacy-preserving cross-silo federated learning engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flwr[simulation]==1.34.0",
    "numpy",
    "ray==2.55.1",
    "torch==2.7.1",
    "pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.flwr.app]
publisher = "fedmed"

[tool.flwr.app.components]
serverapp = "app.main:server_app"
clientapp = "app.main:client_app"

[tool.flwr.app.config]
num-server-rounds = 1

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 2

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true