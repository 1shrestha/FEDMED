# Local smoke test of the deployment container before pushing to a cloud VM:
#   docker compose -f backend/docker-compose.yml up --build
services:
  fedmed-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
      - "8765:8765"
    environment:
      - FL_ROUNDS=5
      - FL_N_CLIENTS=3
      - FL_MIN_CLIENTS=2
